name: Build LanguageWhitegram Dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "Sources/**"
      - "Resources/**"
      - "data/**"
      - "tools/**"
      - "build.sh"
      - "Makefile"
      - ".github/workflows/build-dylib.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Resources/**"
      - "data/**"
      - "tools/**"
      - "build.sh"
      - "Makefile"
      - ".github/workflows/build-dylib.yml"

permissions:
  contents: read

jobs:
  translate:
    name: locale-${{ matrix.code }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        code: [fr, es, zh, vi, fa, pt, ru, tr]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.code }} locale pack
        run: |
          python3 tools/build_one_lang.py "${{ matrix.code }}"
          python3 - <<'PY'
          import json, os
          code = os.environ["LANG_CODE"]
          p = f"Resources/locales/{code}.json"
          d = json.load(open(p, encoding="utf-8"))
          unchanged = sum(1 for k, v in d.items() if k.strip() == v.strip())
          print(f"{code}: entries={len(d)}, unchanged={unchanged}")
          assert len(d) >= 716
          assert unchanged / len(d) <= 0.18
          PY
        env:
          LANG_CODE: ${{ matrix.code }}

      - name: Upload ${{ matrix.code }} locale
        uses: actions/upload-artifact@v4
        with:
          name: locale-${{ matrix.code }}
          path: Resources/locales/${{ matrix.code }}.json
          if-no-files-found: error
          retention-days: 3

  build:
    needs: translate
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download generated locale packs
        uses: actions/download-artifact@v4
        with:
          pattern: locale-*
          path: Resources/locales
          merge-multiple: true

      - name: Show embedded locales
        run: |
          ls -lh Resources/locales
          python3 - <<'PY'
          import json, glob, os
          for p in sorted(glob.glob('Resources/locales/*.json')):
              data = json.load(open(p, encoding='utf-8'))
              unchanged = sum(1 for k, v in data.items() if k.strip() == v.strip())
              print(os.path.basename(p), len(data), 'entries', unchanged, 'unchanged')
          PY

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Verify build-70 localization catalog
        run: |
          python3 tools/verify_translations.py
          python3 tools/verify_runtime_safety.py

      - name: Build arm64 device dylib
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify multilingual strings are embedded
        run: |
          strings build/LanguageWhitegram-ikiraplus.dylib > build/embedded-strings.txt
          grep -Fq "Apariencia" build/embedded-strings.txt
          grep -Fq "Avatares, burbujas de mensajes, efectos" build/embedded-strings.txt
          grep -Fq "فارسی" build/embedded-strings.txt
          echo "Spanish/Persian multilingual payload found in Mach-O"

      - name: Inspect device output
        run: |
          file build/LanguageWhitegram-ikiraplus.dylib
          otool -hv build/LanguageWhitegram-ikiraplus.dylib
          otool -L build/LanguageWhitegram-ikiraplus.dylib
          lipo -info build/LanguageWhitegram-ikiraplus.dylib
          codesign -dv --verbose=4 build/LanguageWhitegram-ikiraplus.dylib 2>&1 || true
          shasum -a 256 build/LanguageWhitegram-ikiraplus.dylib | tee build/SHA256.txt
          cp coverage-report.txt build/coverage-report.txt
          cp data/source_build.json build/source_build.json

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: LanguageWhitegram-ikiraplus-build70
          path: |
            build/LanguageWhitegram-ikiraplus.dylib
            build/SHA256.txt
            build/coverage-report.txt
            build/source_build.json
          if-no-files-found: error
          retention-days: 30
