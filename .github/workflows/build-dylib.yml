name: Build LanguageWhitegram Dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "Sources/**"
      - "Resources/**"
      - "data/**"
      - "tools/**"
      - "build.sh"
      - "Makefile"
      - ".github/workflows/build-dylib.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified multilingual locale packs
        uses: actions/download-artifact@v4
        with:
          pattern: locale-*
          path: Resources/locales
          merge-multiple: true
          repository: imarues/arabwhite
          run-id: 34253835253
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify locale packs before compile
        run: |
          python3 - <<'PY'
          import json, glob, os
          expected = {'ar','es','fa','fr','pt','ru','tr','vi','zh'}
          found = {os.path.splitext(os.path.basename(p))[0] for p in glob.glob('Resources/locales/*.json')}
          print('locales:', sorted(found))
          assert expected <= found, (expected - found)
          for p in sorted(glob.glob('Resources/locales/*.json')):
              data = json.load(open(p, encoding='utf-8'))
              print(os.path.basename(p), len(data), 'entries')
          es = json.load(open('Resources/locales/es.json', encoding='utf-8'))
          assert es.get('Appearance') == 'Apariencia'
          assert es.get('About Whitegram') and es.get('About Whitegram') != 'About Whitegram'
          fa = json.load(open('Resources/locales/fa.json', encoding='utf-8'))
          assert fa.get('Appearance') and fa.get('Appearance') != 'Appearance'
          print('Spanish/Persian root UI translations verified before compile')
          PY

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Verify localization and runtime safety
        run: |
          python3 tools/verify_translations.py
          python3 tools/verify_runtime_safety.py

      - name: Build arm64 device dylib
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify multilingual payload is embedded
        run: |
          strings build/LanguageWhitegram-ikiraplus.dylib > build/embedded-strings.txt
          grep -Fq "Apariencia" build/embedded-strings.txt
          grep -Fq "Avatares, burbujas de mensajes, efectos" build/embedded-strings.txt
          echo "Spanish multilingual payload found in Mach-O"

      - name: Inspect device output
        run: |
          file build/LanguageWhitegram-ikiraplus.dylib
          otool -hv build/LanguageWhitegram-ikiraplus.dylib
          otool -L build/LanguageWhitegram-ikiraplus.dylib
          lipo -info build/LanguageWhitegram-ikiraplus.dylib
          codesign -dv --verbose=4 build/LanguageWhitegram-ikiraplus.dylib 2>&1 || true
          shasum -a 256 build/LanguageWhitegram-ikiraplus.dylib | tee build/SHA256.txt
          cp coverage-report.txt build/coverage-report.txt
          cp data/source_build.json build/source_build.json

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: LanguageWhitegram-ikiraplus-build70
          path: |
            build/LanguageWhitegram-ikiraplus.dylib
            build/SHA256.txt
            build/coverage-report.txt
            build/source_build.json
          if-no-files-found: error
          retention-days: 30
