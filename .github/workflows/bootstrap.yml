name: Install Whitegram MultiLang Project

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-*.b64 > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.xz
          rm -rf bootstrap
          tar -xJf /tmp/project.tar.xz -C . --exclude='.github/workflows/build-dylib.yml'

      - name: Commit project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install Whitegram MultiLang build-70 project"
          git push
